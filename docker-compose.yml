# One-command self-hosting.
#
#   cp .env.example .env                   # set ROOT_PASSWORD, CRYPTO_SECRET
#   docker compose up -d                   # API + MySQL + Redis on :8383
#   docker compose --profile full up -d    # + studio (:3005) and admin console (:3006)
#
# The `full` profile pulls the pre-built studio / console images from GHCR.
# Set PUBLIC_API_URL / PUBLIC_STUDIO_URL to the addresses your browser will use
# (defaults assume everything runs on localhost).
#
# SQL_DSN / REDIS_CONN_STRING below override whatever is in .env so the API talks
# to the bundled services. Change MYSQL_PASSWORD in one place: the `x-db` block.

x-db: &db
  MYSQL_DATABASE: easytv
  MYSQL_USER: easytv
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-easytv}

services:
  api:
    image: ghcr.io/easytv-ai/easytv-api:latest
    # Building locally instead of pulling: uncomment the next line.
    # build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQL_DSN: easytv:${MYSQL_PASSWORD:-change-me-easytv}@tcp(mysql:3306)/easytv?charset=utf8mb4&parseTime=true&loc=Local&timeout=30s
      REDIS_CONN_STRING: redis://redis:6379/0
      PORT: "8383"
    ports:
      - "${API_PORT:-8383}:8383"
    volumes:
      - upload:/app/upload
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      <<: *db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  web:
    image: ghcr.io/easytv-ai/easytv-web:latest
    profiles: [full]
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_NAME: ${SITE_NAME:-EasyTV}
      NUXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8383}
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_STUDIO_URL:-http://localhost:3005}
      NUXT_PUBLIC_MEDIA_HOSTS: ${PUBLIC_MEDIA_HOSTS:-}
      NUXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "${WEB_PORT:-3005}:3005"
    depends_on:
      - api

  manage:
    image: ghcr.io/easytv-ai/easytv-manage:latest
    profiles: [full]
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_NAME: ${SITE_NAME:-EasyTV}
      NUXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8383}
      NUXT_PUBLIC_STUDIO_URL: ${PUBLIC_STUDIO_URL:-http://localhost:3005}
    ports:
      - "${MANAGE_PORT:-3006}:3006"
    depends_on:
      - api

volumes:
  mysql:
  redis:
  upload:
  logs:
